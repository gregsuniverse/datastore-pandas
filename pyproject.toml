[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datastore-pandas"
version = "0.2.0"
description = "A Datastore mode DataFrame interface with pandas and optional Polars support."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Unlicense" }
dependencies = [
  "google-cloud-datastore>=2.20.0",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "polars>=1.0.0",
  "ruff>=0.8.0",
]
polars = [
  "polars>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datastore-pandas"
version = "0.1.0"
description = "A pandas interface for Firestore in Datastore mode with schema-aware typing, key management, projections, batching, and transactions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Unlicense" }
dependencies = [
  "google-cloud-datastore>=2.20.0",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
